    <!-- 自動生成 iOS 可愛 PNG 圖示的魔法腳本 -->
    <script>
        (function generateCuteAppleIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 1024);
            grad.addColorStop(0, '#A7F3D0'); 
            grad.addColorStop(1, '#00704A'); 
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            function drawRoundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 25;

            drawRoundRect(212, 162, 600, 700, 60);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#D1D5DB';
            for(let i = 0; i < 4; i++) {
                drawRoundRect(300 + i * 115, 120, 45, 90, 22);
                ctx.fill();
            }

            ctx.fillStyle = '#FCE7F3'; 
            ctx.beginPath(); ctx.arc(360, 540, 45, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(664, 540, 45, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#1F2937'; 
            ctx.beginPath(); ctx.arc(420, 490, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(604, 490, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(410, 475, 14, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(594, 475, 14, 0, Math.PI*2); ctx.fill();

            ctx.strokeStyle = '#1F2937';
            ctx.lineWidth = 18;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(512, 510, 70, 0.15*Math.PI, 0.85*Math.PI, false);
            ctx.stroke();

            ctx.strokeStyle = '#F59E0B'; 
            ctx.lineWidth = 55;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(380, 680);
            ctx.lineTo(480, 780);
            ctx.lineTo(700, 560);
            ctx.stroke();

            const pngUrl = canvas.toDataURL('image/png');
            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = pngUrl;
            document.head.appendChild(appleIcon);
            const standardIcon = document.createElement('link');
            standardIcon.rel = 'icon';
            standardIcon.href = pngUrl;
            document.head.appendChild(standardIcon);
        })();
    </script>

                "settings": <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,

                "clipboard": <><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></>,
                "trophy": <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>,
                "alert-circle": <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
                "refresh-cw": <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>,

                "list-checks": <><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="m3 6 1 1 2-2"/><path d="m3 12 1 1 2-2"/><path d="m3 18 1 1 2-2"/></>

                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons["check"]}
                </svg>
            );
        };

        const DEFAULT_GROUPS = [ { id: 'g1', name: '國三' }, { id: 'g2', name: '國一' } ];
        const DEFAULT_CLASSES = {
            '901': [
                { id: '1', name: '王小明' }, { id: '2', name: '陳小華' },
                { id: '3', name: '李大仁' }, { id: '4', name: '張小芬' }, { id: '5', name: '林美麗' }
            ]
        };
        const DEFAULT_CLASS_GROUPS = { '901': 'g1' };
        const DEFAULT_TAGS = {
            positive: [
                { id: 'p1', label: '上課發言', value: 1 }, { id: 'p2', label: '分組合作', value: 2 }, { id: 'p3', label: '熱心服務', value: 1 }
            ],
            negative: [
                { id: 'n1', label: '未交作業', value: -1 }, { id: 'n2', label: '上課聊天', value: -1 }, { id: 'n3', label: '遲到', value: -1 }
            ]
        };
        const DEFAULT_GRADE_ITEMS = [
            { id: 'gr1', label: '平時考一' }, { id: 'gr2', label: '作業成績' }, { id: 'gr3', label: '期中考' }
        ];

        function App() {
            const [view, setView] = useState('main');
            
            // 核心資料狀態
            const [groups, setGroups] = useState(DEFAULT_GROUPS);
            const [classes, setClasses] = useState(DEFAULT_CLASSES);
            const [classGroups, setClassGroups] = useState(DEFAULT_CLASS_GROUPS);
            const [tags, setTags] = useState(DEFAULT_TAGS);
            const [gradeItems, setGradeItems] = useState(DEFAULT_GRADE_ITEMS);
            const [records, setRecords] = useState({});
            const [leaveStatus, setLeaveStatus] = useState({});
            
            // 畫面互動狀態
            const [activeGroupId, setActiveGroupId] = useState('g1');
            const [selectedClass, setSelectedClass] = useState('');
            const [searchKeyword, setSearchKeyword] = useState('');
            const [toast, setToast] = useState(null);
            
            // 彈出視窗狀態
            const [modal, setModal] = useState({ isOpen: false, type: null, student: null });
            const [tempGrade, setTempGrade] = useState('');
            const [gradeTitle, setGradeTitle] = useState('');
            
            // 管理後台暫存狀態
            const [newGroupName, setNewGroupName] = useState('');
            const [editClass, setEditClass] = useState('');
            const [newClassGroup, setNewClassGroup] = useState('g1');
            const [newStudent, setNewStudent] = useState({ id: '', name: '' });
            const [newTag, setNewTag] = useState({ label: '', value: 1, type: 'positive' });
            const [newGradeItem, setNewGradeItem] = useState({ label: '' });
            
            // 批次登記/匯入狀態
            const [batchText, setBatchText] = useState('');
            const [batchRecordConfig, setBatchRecordConfig] = useState({ type: 'negative', tagId: '', value: '', studentIds: '' });

            // 標籤編輯狀態
            const [editingTagId, setEditingTagId] = useState(null);
            const [editTagInput, setEditTagInput] = useState({ label: '', value: 1 });
            const [editingGradeId, setEditingGradeId] = useState(null);
            const [editGradeInput, setEditGradeInput] = useState({ label: '' });

            const [spinnerModal, setSpinnerModal] = useState({ isOpen: false, spinning: false, currentStudent: null });
            const fileInputRef = useRef(null);

            useEffect(() => {
                try {
                    const savedGroups = localStorage.getItem('teacherApp_groups');
                    const savedClasses = localStorage.getItem('teacherApp_classes');
                    const savedClassGroups = localStorage.getItem('teacherApp_classGroups');
                    const savedTags = localStorage.getItem('teacherApp_tags');
                    const savedGradeItems = localStorage.getItem('teacherApp_gradeItems');
                    const savedRecords = localStorage.getItem('teacherApp_records');
                    const savedLeave = localStorage.getItem('teacherApp_leave');
                    
                    if (savedGroups) {
                        const parsed = JSON.parse(savedGroups);
                        setGroups(parsed);
                        if (parsed.length > 0) setActiveGroupId(parsed[0].id);
                    }
                    if (savedClasses) setClasses(JSON.parse(savedClasses));
                    if (savedClassGroups) setClassGroups(JSON.parse(savedClassGroups));
                    if (savedTags) setTags(JSON.parse(savedTags));
                    if (savedGradeItems) setGradeItems(JSON.parse(savedGradeItems));
                    if (savedRecords) setRecords(JSON.parse(savedRecords));
                    if (savedLeave) setLeaveStatus(JSON.parse(savedLeave));
                } catch (e) {}
            }, []);

            useEffect(() => {
                const classesInGroup = Object.keys(classes).filter(cls => classGroups[cls] === activeGroupId);
                if (classesInGroup.length > 0 && !classesInGroup.includes(selectedClass)) {
                    setSelectedClass(classesInGroup[0]);
                } else if (classesInGroup.length === 0) {
                    setSelectedClass('');
                }
            }, [activeGroupId, classes, classGroups]);

            // 自動設定打成績對話框的預設選項
            useEffect(() => {
                if (modal.type === 'grade' && gradeItems.length > 0 && !gradeTitle) {
                    setGradeTitle(gradeItems[0].label);
                }
            }, [modal.type, gradeItems]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const saveToStorage = (key, data) => {
                try { localStorage.setItem(`teacherApp_${key}`, JSON.stringify(data)); } catch (e) {}
            };

            const toggleLeaveStatus = (studentId) => {
                const studentKey = `${selectedClass}-${studentId}`;
                setLeaveStatus(prev => {
                    const newStatus = { ...prev, [studentKey]: !prev[studentKey] };
                    saveToStorage('leave', newStatus);
                    return newStatus;
                });
            };

            const addRecord = (studentId, type, detail, value = null) => {
                const studentKey = `${selectedClass}-${studentId}`;
                if (leaveStatus[studentKey]) return showToast("該學生請假中，無法登記！");

                const newRecord = {
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    date: new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                    type, detail, value: value ? Number(value) : null
                };
                
                setRecords(prev => {
                    const updated = { ...prev };
                    if (!updated[studentKey]) updated[studentKey] = [];
                    updated[studentKey] = [newRecord, ...updated[studentKey]];
                    saveToStorage('records', updated);
                    return updated;
                });
                showToast(`${detail} 已登記！`);
            };

            const deleteRecord = (studentKey, recordId) => {
                setRecords(prev => {
                    const updated = { ...prev };
                    updated[studentKey] = updated[studentKey].filter(r => r.id !== recordId);
                    saveToStorage('records', updated);
                    return updated;
                });
            };

            const clearAllRecords = () => {
                if (window.confirm("⚠️ 警告：這將會清空所有學生的「加扣分」與「成績」紀錄！名單與設定會保留。確定要繼續嗎？")) {
                    setRecords({});
                    saveToStorage('records', {});
                    showToast("所有紀錄已成功清除！");
                }
            };

            const exportExcel = () => {
                if (!selectedClass) return showToast('請先選擇班級');
                const currentStudents = classes[selectedClass] || [];
                if (currentStudents.length === 0) return showToast('目前班級無學生資料');

                const excelData = [];

                currentStudents.forEach(student => {
                    const sRecords = records[`${selectedClass}-${student.id}`] || [];
                    let behaviorSum = 0;
                    let grades = {};

                    [...sRecords].reverse().forEach(r => {
                        if (r.type === '加分' || r.type === '扣分') {
                            behaviorSum += (r.value || 0);
                        } else if (r.type === '成績') {
                            grades[r.detail] = r.value;
                        }
                    });

                    let rowObj = {
                        '班級': selectedClass,
                        '座號': parseInt(student.id), 
                        '姓名': student.name,
                        '行為表現總計': behaviorSum
                    };

                    gradeItems.forEach(item => {
                        rowObj[item.label] = grades[item.label] !== undefined ? grades[item.label] : '';
                    });
                    
                    excelData.push(rowObj);
                });

                if (window.XLSX) {
                    const worksheet = XLSX.utils.json_to_sheet(excelData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "成績總表");
                    XLSX.writeFile(workbook, `${selectedClass}班_成績總表_${new Date().toLocaleDateString()}.xlsx`);
                    showToast("Excel 成績表已成功下載！");
                } else {
                    let csvContent = "\uFEFF"; 
                    const headers = ['班級', '座號', '姓名', '行為表現總計'];
                    gradeItems.forEach(item => headers.push(item.label));
                    csvContent += headers.join(',') + '\n';
                    
                    excelData.forEach(row => {
                        let rowArr = [row['班級'], row['座號'], row['姓名'], row['行為表現總計']];
                        gradeItems.forEach(item => rowArr.push(row[item.label]));
                        csvContent += rowArr.join(',') + '\n';
                    });

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `${selectedClass}班_成績總表_${new Date().toLocaleDateString()}.csv`);
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    showToast("Excel(CSV) 成績表已下載！");
                }
            };

            const processBatchRecord = () => {
                const ids = [...new Set(batchRecordConfig.studentIds.match(/\d+/g) || [])];
                if (ids.length === 0) return alert("請在下方輸入區填寫至少一個座號數字");

                const currentClassStudents = classes[selectedClass] || [];
                const validIds = ids.filter(id => currentClassStudents.some(s => s.id === id));
                const invalidIds = ids.filter(id => !currentClassStudents.some(s => s.id === id));

                if (validIds.length === 0) return alert("輸入的座號皆不存在於此班級");
                if (invalidIds.length > 0) {
                    if(!window.confirm(`找不到座號: ${invalidIds.join(', ')}。要略過並繼續為其他 ${validIds.length} 人登記嗎？`)) return;
                }

                let detail = ''; let val = null; let type = '';

                if (batchRecordConfig.type === 'positive') {
                    const tag = tags.positive.find(t => t.id === batchRecordConfig.tagId);
                    if(!tag) return alert('請選擇加分項目');
                    detail = tag.label; val = tag.value; type = '加分';
                } else if (batchRecordConfig.type === 'negative') {
                    const tag = tags.negative.find(t => t.id === batchRecordConfig.tagId);
                    if(!tag) return alert('請選擇扣分項目');
                    detail = tag.label; val = tag.value; type = '扣分';
                } else {
                    const gItem = gradeItems.find(g => g.id === batchRecordConfig.tagId);
                    if(!gItem) return alert('請選擇成績項目');
                    detail = gItem.label; val = Number(batchRecordConfig.value); type = '成績';
                    if (isNaN(val)) return alert("請輸入有效的分數數值");
                }

                const now = new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                
                setRecords(prev => {
                    const updated = { ...prev };
                    let appliedCount = 0;
                    validIds.forEach(id => {
                        const studentKey = `${selectedClass}-${id}`;
                        if (leaveStatus[studentKey]) return; 
                        const newRecord = { id: Date.now().toString() + Math.random().toString(36).substr(2, 5), date: now, type, detail, value: val };
                        if (!updated[studentKey]) updated[studentKey] = [];
                        updated[studentKey] = [newRecord, ...updated[studentKey]];
                        appliedCount++;
                    });
                    saveToStorage('records', updated);
                    setTimeout(() => showToast(`成功為 ${appliedCount} 位學生登記 ${detail}！`), 100);
                    return updated;
                });

                setModal({ isOpen: false, type: null });
                setBatchRecordConfig(prev => ({...prev, studentIds: ''}));
            };

            const addGroup = () => {
                if (!newGroupName.trim()) return;
                const newId = `g${Date.now()}`;
                const updatedGroups = [...groups, { id: newId, name: newGroupName.trim() }];
                setGroups(updatedGroups); saveToStorage('groups', updatedGroups); setNewGroupName(''); showToast(`已新增年段：${newGroupName}`);
            };

            const deleteGroup = (groupId) => {
                if (groups.length <= 1) return alert("必須保留至少一個年段！");
                if (window.confirm("刪除此年段會將其下班級轉移至其他年段，確定刪除嗎？")) {
                    const remainingGroups = groups.filter(g => g.id !== groupId);
                    const targetGroupId = remainingGroups[0].id; 
                    const updatedClassGroups = { ...classGroups };
                    Object.keys(updatedClassGroups).forEach(cls => { if (updatedClassGroups[cls] === groupId) updatedClassGroups[cls] = targetGroupId; });
                    setGroups(remainingGroups); setClassGroups(updatedClassGroups);
                    saveToStorage('groups', remainingGroups); saveToStorage('classGroups', updatedClassGroups);
                    if (activeGroupId === groupId) setActiveGroupId(targetGroupId);
                }
            };

            const addClass = () => {
                const newClassName = prompt("請輸入新班級名稱 (例如: 901)");
                if (newClassName && !classes[newClassName]) {
                    const updatedClasses = { ...classes, [newClassName]: [] };
                    const updatedClassGroups = { ...classGroups, [newClassName]: newClassGroup };
                    setClasses(updatedClasses); setClassGroups(updatedClassGroups);
                    saveToStorage('classes', updatedClasses); saveToStorage('classGroups', updatedClassGroups);
                    setEditClass(newClassName); setActiveGroupId(newClassGroup); setSelectedClass(newClassName);
                    showToast(`班級 ${newClassName} 已新增`);
                } else if (classes[newClassName]) {
                    alert("該班級已存在！");
                }
            };

            const deleteClass = (className) => {
                if (window.confirm(`確定要刪除 ${className} 班及其所有學生名單嗎？`)) {
                    const updatedClasses = { ...classes }; const updatedClassGroups = { ...classGroups };
                    delete updatedClasses[className]; delete updatedClassGroups[className];
                    setClasses(updatedClasses); setClassGroups(updatedClassGroups);
                    saveToStorage('classes', updatedClasses); saveToStorage('classGroups', updatedClassGroups);
                    const remainingClasses = Object.keys(updatedClasses);
                    setEditClass(remainingClasses.length > 0 ? remainingClasses[0] : '');
                }
            };

            const addStudent = () => {
                if (!newStudent.id || !newStudent.name || !editClass) return;
                if (classes[editClass].some(s => s.id === newStudent.id)) return alert("座號已存在！");
                const updatedClasses = { ...classes };
                updatedClasses[editClass] = [...updatedClasses[editClass], { ...newStudent }].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                setClasses(updatedClasses); saveToStorage('classes', updatedClasses); setNewStudent({ id: '', name: '' });
            };

            const deleteStudent = (studentId) => {
                const updatedClasses = { ...classes };
                updatedClasses[editClass] = updatedClasses[editClass].filter(s => s.id !== studentId);
                setClasses(updatedClasses); saveToStorage('classes', updatedClasses);
            };

            const handleBatchImport = () => {
                if (!batchText.trim()) return;
                const lines = batchText.split('\n').map(l => l.trim()).filter(l => l);
                const currentStudents = classes[editClass] || [];
                let nextId = currentStudents.length > 0 ? Math.max(...currentStudents.map(s => parseInt(s.id) || 0)) + 1 : 1;
                let importCount = 0; const newStudents = [];

                lines.forEach(line => {
                    const match = line.match(/^(\d+)[\.\s]+(.+)$/);
                    let id, name;
                    if (match) { id = match[1]; name = match[2].trim(); } 
                    else { id = nextId.toString(); name = line; nextId++; }
                    if (!currentStudents.some(s => s.id === id) && !newStudents.some(s => s.id === id)) {
                        newStudents.push({ id, name }); importCount++;
                    }
                });

                if (importCount > 0) {
                    const updatedClass = [...currentStudents, ...newStudents].sort((a, b) => parseInt(a.id) - parseInt(b.id));
                    const updatedClasses = { ...classes, [editClass]: updatedClass };
                    setClasses(updatedClasses); saveToStorage('classes', updatedClasses);
                    showToast(`成功匯入 ${importCount} 位學生！`);
                } else alert("無匯入資料 (格式錯誤或座號已存在)");
                
                setBatchText(''); setModal({ isOpen: false, type: null, student: null });
            };

            // 標籤與成績項目管理
            const addNewTag = () => {
                if (!newTag.label) return;
                const typeKey = newTag.type;
                const newTagObj = { id: Date.now().toString(), label: newTag.label, value: typeKey === 'positive' ? Math.abs(newTag.value) : -Math.abs(newTag.value) };
                setTags(prev => {
                    const updated = { ...prev, [typeKey]: [...prev[typeKey], newTagObj] };
                    saveToStorage('tags', updated); return updated;
                });
                setNewTag({ label: '', value: 1, type: newTag.type });
            };
            const deleteTag = (type, tagId) => {
                setTags(prev => {
                    const updated = { ...prev, [type]: prev[type].filter(t => t.id !== tagId) };
                    saveToStorage('tags', updated); return updated;
                });
            };
            const startEditTag = (tag) => { setEditingTagId(tag.id); setEditTagInput({ label: tag.label, value: Math.abs(tag.value) }); };
            const saveEditTag = (type, tagId) => {
                if (!editTagInput.label.trim()) return;
                const finalValue = type === 'positive' ? Math.abs(editTagInput.value) : -Math.abs(editTagInput.value);
                setTags(prev => {
                    const updated = { ...prev, [type]: prev[type].map(t => t.id === tagId ? { ...t, label: editTagInput.label.trim(), value: finalValue } : t) };
                    saveToStorage('tags', updated); return updated;
                });
                setEditingTagId(null);
            };

            const addNewGradeItem = () => {
                if (!newGradeItem.label.trim()) return;
                const newItem = { id: Date.now().toString(), label: newGradeItem.label.trim() };
                setGradeItems(prev => {
                    const updated = [...prev, newItem]; saveToStorage('gradeItems', updated); return updated;
                });
                setNewGradeItem({ label: '' });
            };
            const deleteGradeItem = (id) => {
                setGradeItems(prev => {
                    const updated = prev.filter(g => g.id !== id); saveToStorage('gradeItems', updated); return updated;
                });
            };
            const startEditGrade = (item) => { setEditingGradeId(item.id); setEditGradeInput({ label: item.label }); };
            const saveEditGrade = (id) => {
                if (!editGradeInput.label.trim()) return;
                setGradeItems(prev => {
                    const updated = prev.map(g => g.id === id ? { ...g, label: editGradeInput.label.trim() } : g);
                    saveToStorage('gradeItems', updated); return updated;
                });
                setEditingGradeId(null);
            };

            const exportData = () => {
                const backupData = { groups, classes, classGroups, tags, gradeItems, records, leaveStatus, exportDate: new Date().toISOString() };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
                const a = document.createElement('a');
                a.href = dataStr; a.download = `課程登記本備份_${new Date().toLocaleDateString()}.json`; a.click();
            };

            const importData = (event) => {
                const file = event.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.classes && data.tags) {
                            if(window.confirm("匯入備份將覆蓋目前所有資料，確定繼續嗎？")) {
                                if (data.groups) setGroups(data.groups);
                                if (data.classGroups) setClassGroups(data.classGroups);
                                setClasses(data.classes); setTags(data.tags);
                                if (data.gradeItems) setGradeItems(data.gradeItems);
                                if (data.records) setRecords(data.records);
                                if (data.leaveStatus) setLeaveStatus(data.leaveStatus);
                                
                                saveToStorage('groups', data.groups || DEFAULT_GROUPS);
                                saveToStorage('classes', data.classes);
                                saveToStorage('classGroups', data.classGroups || DEFAULT_CLASS_GROUPS);
                                saveToStorage('tags', data.tags);
                                saveToStorage('gradeItems', data.gradeItems || DEFAULT_GRADE_ITEMS);
                                saveToStorage('records', data.records || {});
                                saveToStorage('leave', data.leaveStatus || {});
                                
                                showToast("資料已成功還原！"); setView('main');
                            }
                        }
                    } catch (err) { alert("讀取檔案失敗，格式不正確。"); }
                };
                reader.readAsText(file); event.target.value = '';
            };

            const currentClassStudents = selectedClass ? (classes[selectedClass] || []) : [];
            const filteredStudents = currentClassStudents.filter(s => s.name.includes(searchKeyword) || s.id.includes(searchKeyword));

            const missingHomeworkStudents = currentClassStudents.filter(s => {
                const sRecords = records[`${selectedClass}-${s.id}`] || [];
                return sRecords.some(r => r.type === '扣分' && r.detail.includes('作業'));
            });

            const top5Students = currentClassStudents.map(student => {
                const sRecords = records[`${selectedClass}-${student.id}`] || [];
                const score = sRecords.reduce((sum, r) => (r.type === '加分' || r.type === '扣分') ? sum + (r.value || 0) : sum, 0);
                return { ...student, score };

            const startSpinner = () => {

                                <div className="flex flex-wrap items-center gap-2 md:gap-3 w-full md:w-auto justify-end">
                                    <div className="flex bg-gray-200/80 rounded-xl p-1 shadow-inner overflow-x-auto max-w-[220px] sm:max-w-none no-scrollbar">
                                        {groups.map((group, idx) => (
                                            <button key={group.id} onClick={() => setActiveGroupId(group.id)} className={`px-4 py-1.5 rounded-lg font-bold transition-all whitespace-nowrap ${activeGroupId === group.id ? `${colorPalette[idx % colorPalette.length]} text-white shadow-md transform scale-[1.02]` : 'text-gray-600 hover:bg-gray-300'}`}>
                                                {group.name}
                                            </button>

                                    </div>

                                    <div className="relative">
                                        <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} className="text-lg py-2 pl-4 pr-10 rounded-xl border-2 border-gray-200 bg-white shadow-sm focus:border-[#00704A] focus:outline-none font-medium min-w-[120px] cursor-pointer" style={{ backgroundImage: `url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e")`, backgroundPosition: 'right 0.75rem center', backgroundRepeat: 'no-repeat', backgroundSize: '1.2em 1.2em' }}>
                                            {Object.keys(classes).filter(cls => classGroups[cls] === activeGroupId).map(cls => (
                                                <option key={cls} value={cls}>{cls} 班</option>
                                            ))}
                                        </select>
                                    </div>
                                    
                                    <button onClick={() => setView('settings')} className="flex items-center justify-center gap-2 bg-gray-100 text-gray-700 py-2.5 px-4 rounded-xl shadow-sm hover:bg-gray-200 transition-colors font-medium">
                                        <Icon name="settings" size={18} />
                                        <span className="hidden md:inline">管理後台</span>
                                    </button>
                                </div>
                            </div>

                            {/* --- 搜尋列 --- */}
                            <div className="max-w-7xl mx-auto relative mb-6">
                                <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={20} />
                                <input type="text" placeholder="搜尋座號或姓名..." value={searchKeyword} onChange={(e) => setSearchKeyword(e.target.value)} className="w-full bg-white border-2 border-gray-200 rounded-2xl py-3 pl-10 pr-4 focus:outline-none focus:border-[#00704A] shadow-sm transition-colors text-lg" />
                            </div>

                            {/* --- 班級資訊儀表板 --- */}
                            {selectedClass && currentClassStudents.length > 0 && (
                                <div className="max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
                                    <div className="col-span-2 md:col-span-1 bg-orange-50 border border-orange-200 p-4 rounded-2xl flex items-center gap-3 shadow-sm">
                                        <div className="bg-orange-100 p-2.5 rounded-xl text-orange-600 shrink-0"><Icon name="trophy" size={24}/></div>
                                        <div className="min-w-0">
                                            <div className="text-sm font-bold text-orange-800 mb-0.5">積分前五名</div>
                                            <div className="text-orange-700 font-medium text-sm truncate">{top5Students.length > 0 ? top5Students.map(s => `${s.id}號`).join(', ') : '尚無資料'}</div>
                                        </div>
                                    </div>
                                    <div className="col-span-2 md:col-span-1 bg-red-50 border border-red-200 p-4 rounded-2xl flex items-center gap-3 shadow-sm">
                                        <div className="bg-red-100 p-2.5 rounded-xl text-red-600 shrink-0"><Icon name="alert-circle" size={24}/></div>
                                        <div className="min-w-0">
                                            <div className="text-sm font-bold text-red-800 mb-0.5">作業缺交座號</div>
                                            <div className="text-red-700 font-medium text-sm truncate">{missingHomeworkStudents.length > 0 ? missingHomeworkStudents.map(s => `${s.id}號`).join(', ') : '全班皆已繳交 🎉'}</div>
                                        </div>
                                    </div>
                                    <button onClick={() => {
                                            setBatchRecordConfig({ type: 'negative', tagId: tags.negative.length > 0 ? tags.negative[0].id : '', value: '', studentIds: '' });
                                            setModal({ isOpen: true, type: 'batchRecord' });
                                        }} 
                                        className="bg-blue-600 border border-blue-700 p-3 rounded-2xl flex items-center justify-center gap-2 shadow-sm hover:bg-blue-700 transition-all active:scale-95 text-white"
                                    >
                                        <Icon name="list-checks" size={22}/>
                                        <span className="text-base font-bold tracking-wide">批次登記</span>
                                    </button>
                                    <button onClick={startSpinner} className="bg-gradient-to-r from-[#00704A] to-emerald-500 border border-green-700 p-3 rounded-2xl flex items-center justify-center gap-2 shadow-sm hover:shadow-md transition-all active:scale-95 text-white">
                                        <Icon name="refresh-cw" size={22}/>
                                        <span className="text-base font-bold tracking-wide">抽籤轉盤</span>
                                    </button>
                                </div>
                            )}

                            {/* --- 學生列表網格區 --- */}
                            {!selectedClass || currentClassStudents.length === 0 ? (
                                <div className="text-center py-20 text-gray-400 bg-white rounded-3xl border border-dashed border-gray-300 max-w-7xl mx-auto">
                                    <Icon name="users" size={48} className="mx-auto mb-4 opacity-50" />
                                    <p className="text-lg">此年段目前沒有班級或學生資料</p>
                                    <button onClick={() => setView('settings')} className="mt-4 text-[#00704A] font-semibold hover:underline">前往管理後台建立名單</button>
                                </div>
                            ) : (
                                <div className="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 md:gap-5">
                                    {filteredStudents.map(student => {
                                        const studentKey = `${selectedClass}-${student.id}`;
                                        const studentRecords = records[studentKey] || [];
                                        const isLeave = leaveStatus[studentKey] || false;
                                        const lastRecord = studentRecords.length > 0 ? studentRecords[0] : null;
                                        
                                        const scoreSum = studentRecords.reduce((sum, r) => (r.type === '加分' || r.type === '扣分') ? sum + (r.value || 0) : sum, 0);

                                        return (
                                            <div key={student.id} className={`p-4 rounded-2xl border-b-4 shadow-sm flex flex-col relative transition-all duration-300 hover:-translate-y-1 ${isLeave ? 'bg-blue-50 border-blue-200 border-b-blue-300' : 'bg-white border-gray-200 border-b-gray-300'}`}>
                                                {scoreSum !== 0 && !isLeave && (
                                                    <div className={`absolute -top-3 -left-2 text-white text-sm font-bold min-w-[28px] h-7 px-2 rounded-full flex items-center justify-center border-2 border-white shadow-sm ${scoreSum > 0 ? 'bg-green-500' : 'bg-red-500'}`}>
                                                        {scoreSum > 0 ? `+${scoreSum}` : scoreSum}
                                                    </div>

                                                <button onClick={() => toggleLeaveStatus(student.id)} className={`absolute top-2 right-2 p-1.5 rounded-lg transition-colors ${isLeave ? 'bg-blue-600 text-white shadow-sm' : 'bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600'}`} title="標記請假/取消">
                                                    {isLeave ? <Icon name="user-x" size={16} /> : <Icon name="user-check" size={16} />}

                                                    <span className="text-sm mr-1 opacity-60">{student.id}.</span> {student.name}
                                                    <div className={`text-xs font-normal mt-1 truncate h-4 ${isLeave ? 'text-blue-600' : 'text-gray-400'}`}>
                                                        {lastRecord ? `${lastRecord.date.substring(5,10)} ${lastRecord.detail}` : '尚無紀錄'}

                                                <div className={`flex flex-col gap-2 mb-3 overflow-y-auto pr-1 custom-scrollbar ${isLeave ? 'opacity-40 pointer-events-none' : ''}`} style={{maxHeight: '160px'}}>

                                                            <span className="truncate flex items-center gap-1"><Icon name="thumbs-up" size={12}/> {tag.label}</span>

                                                            <span className="truncate flex items-center gap-1"><Icon name="thumbs-down" size={12}/> {tag.label}</span>

                                                        <Icon name="history" size={14} /> 紀錄
                                                    </button>

                                            </div>

                                        <span className="text-lg font-bold tracking-wide">下載 {selectedClass} 班成績總表 (Excel)</span>

                    ) : (

                            <div className="flex items-center justify-between mb-8 border-b border-gray-100 pb-4">

                                    <Icon name="settings" className="text-gray-500" /> 系統管理後台
                                </h2>
                                <button onClick={() => setView('main')} className="flex items-center gap-1 text-gray-500 hover:text-gray-800 font-medium py-2 px-4 rounded-xl hover:bg-gray-100 transition-colors">
                                    <Icon name="chevron-left" size={20} /> 返回主畫面

                    {/* 幸運抽籤轉盤 */}
                    {spinnerModal.isOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl text-center pb-8 pt-4 relative">
                                <div className="absolute top-4 right-4">
                                    <button onClick={() => !spinnerModal.spinning && setSpinnerModal({ isOpen: false, spinning: false, currentStudent: null })} className={`p-1 rounded-full ${spinnerModal.spinning ? 'text-gray-200 cursor-not-allowed' : 'text-gray-400 hover:bg-gray-100'}`}>
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-6 mt-4">幸運抽籤轉盤</h3>

                                <div className="flex justify-center items-center mb-8 h-36">
                                    <div className={`w-36 h-36 rounded-full flex flex-col items-center justify-center text-5xl font-bold border-4 shadow-inner ${spinnerModal.spinning ? 'bg-blue-100 border-blue-400 text-blue-600 animate-pulse' : 'bg-green-100 border-green-500 text-green-700 scale-110 transition-transform duration-300'}`}>
                                        {spinnerModal.currentStudent ? spinnerModal.currentStudent.id : '?'}
                                        <span className="text-xl mt-2 font-medium">{spinnerModal.currentStudent ? spinnerModal.currentStudent.name : ''}</span>
                                    </div>
                                </div>

                                {spinnerModal.spinning ? (
                                    <div className="text-blue-500 font-bold animate-pulse text-xl">轉動中...</div>
                                ) : (
                                    <div className="space-y-5">
                                        <div className="text-green-600 font-bold text-2xl">🎉 恭喜中獎 🎉</div>
                                        <div className="flex justify-center gap-3 px-6">
                                            <button onClick={() => {
                                                setGradeTitle(gradeItems.length > 0 ? gradeItems[0].label : '');
                                                setModal({ isOpen: true, type: 'grade', student: spinnerModal.currentStudent });
                                                setSpinnerModal({ isOpen: false, spinning: false, currentStudent: null });
                                            }} className="flex-1 border-2 border-indigo-200 text-indigo-600 py-3 rounded-xl font-bold hover:bg-indigo-50 transition-colors">加平時成績</button>
                                            <button onClick={startSpinner} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-md">再抽一次</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 提示吐司 */}
                    {toast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 z-50 transition-opacity">
                            <Icon name="check-circle-2" size={20} className="text-green-400" />
                            <span className="font-medium tracking-wide">{toast}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
